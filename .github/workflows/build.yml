name: Build Windows App

on:
  push:
    branches: [main, feature/*, stage/*]
  pull_request:
    branches: [main]

jobs:
  build-mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++-mingw-w64-x86-64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziovpontvrs-win64
          path: build/ziovpontvrs.exe
